<nav
  class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30 transition-colors duration-300"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div
      class="flex justify-between h-16 items-center gap-4"
    >
      <!-- Mobile/Tablet hamburger menu -->
      <button
        (click)="onMobileSidebarToggle()"
        class="lg:hidden p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
        aria-label="Toggle sidebar"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="h-6 w-6"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M4 6h16M4 12h16M4 18h16"
          />
        </svg>
      </button>

      <div class="flex items-center gap-4"
    >
      <div
        class="bg-slate-100 dark:bg-slate-700 p-1 rounded-lg flex text-sm font-medium transition-colors"
      >
          <button
            (click)="onRangeChange('M')"
            [class.bg-white]="appState.selectedTimeRange() === 'M'"
            [class.dark:bg-slate-600]="appState.selectedTimeRange() === 'M'"
            [class.text-slate-900]="appState.selectedTimeRange() === 'M'"
            [class.dark:text-white]="appState.selectedTimeRange() === 'M'"
            [class.shadow-xs]="appState.selectedTimeRange() === 'M'"
            [class.font-semibold]="appState.selectedTimeRange() === 'M'"
            [class.text-slate-500]="appState.selectedTimeRange() !== 'M'"
            [class.dark:text-slate-300]="appState.selectedTimeRange() !== 'M'"
            class="px-3 py-1.5 rounded-md transition hover:text-slate-900 dark:hover:text-white"
          >
            1M
          </button>
          <button
            (click)="onRangeChange('Y')"
            [class.bg-white]="appState.selectedTimeRange() === 'Y'"
            [class.dark:bg-slate-600]="appState.selectedTimeRange() === 'Y'"
            [class.text-slate-900]="appState.selectedTimeRange() === 'Y'"
            [class.dark:text-white]="appState.selectedTimeRange() === 'Y'"
            [class.shadow-xs]="appState.selectedTimeRange() === 'Y'"
            [class.font-semibold]="appState.selectedTimeRange() === 'Y'"
            [class.text-slate-500]="appState.selectedTimeRange() !== 'Y'"
            [class.dark:text-slate-300]="appState.selectedTimeRange() !== 'Y'"
            class="px-3 py-1.5 rounded-md transition hover:text-slate-900 dark:hover:text-white"
          >
            1J
          </button>
          <button
            (click)="onRangeChange('5Y')"
            [class.bg-white]="appState.selectedTimeRange() === '5Y'"
            [class.dark:bg-slate-600]="appState.selectedTimeRange() === '5Y'"
            [class.text-slate-900]="appState.selectedTimeRange() === '5Y'"
            [class.dark:text-white]="appState.selectedTimeRange() === '5Y'"
            [class.shadow-xs]="appState.selectedTimeRange() === '5Y'"
            [class.font-semibold]="appState.selectedTimeRange() === '5Y'"
            [class.text-slate-500]="appState.selectedTimeRange() !== '5Y'"
            [class.dark:text-slate-300]="appState.selectedTimeRange() !== '5Y'"
            class="px-3 py-1.5 rounded-md transition hover:text-slate-900 dark:hover:text-white"
          >
            5J
          </button>
          <button
            (click)="onRangeChange('ALL')"
            [class.bg-white]="appState.selectedTimeRange() === 'ALL'"
            [class.dark:bg-slate-600]="appState.selectedTimeRange() === 'ALL'"
            [class.text-slate-900]="appState.selectedTimeRange() === 'ALL'"
            [class.dark:text-white]="appState.selectedTimeRange() === 'ALL'"
            [class.shadow-xs]="appState.selectedTimeRange() === 'ALL'"
            [class.font-semibold]="appState.selectedTimeRange() === 'ALL'"
            [class.text-slate-500]="appState.selectedTimeRange() !== 'ALL'"
            [class.dark:text-slate-300]="appState.selectedTimeRange() !== 'ALL'"
            class="px-3 py-1.5 rounded-md transition hover:text-slate-900 dark:hover:text-white"
          >
            Max
          </button>
        </div>

        <button
          (click)="onThemeToggle()"
          class="p-2 rounded-lg text-slate-500 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition"
        >
          @if (appState.isDarkMode()) {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"
            />
          </svg>
          } @else {
          <svg
            xmlns="http://www.w3.org/2000/svg"
            class="h-5 w-5"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"
            />
          </svg>
          }
        </button>

        <div class="relative">
          <button
            (click)="onMenuToggle()"
            class="bg-brand-600 hover:bg-brand-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition shadow-xs flex items-center gap-2 whitespace-nowrap"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 4v16m8-8H4"
              />
            </svg>
            <span>Neu</span>
            <svg
              xmlns="http://www.w3.org/2000/svg"
              class="h-4 w-4 transition-transform"
              [class.rotate-180]="appState.showMenu()"
              fill="none"
              viewBox="0 0 24 24"
              stroke="currentColor"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M19 9l-7 7-7-7"
              />
            </svg>
          </button>

          @if (appState.showMenu()) {
          <div
            class="absolute right-0 mt-2 w-56 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg shadow-lg overflow-hidden z-50"
          >
            @for (option of menuOptions(); track option.label; let first = $first) {
              <button
                (click)="option.action()"
                [class]="'w-full px-4 py-3 text-left text-sm text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center gap-3' + (first ? '' : ' border-t border-slate-100 dark:border-slate-700')"
              >
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  [class]="'h-5 w-5 text-' + option.color + '-600 dark:text-' + option.color + '-400'"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    [attr.d]="option.icon"
                  />
                </svg>
                <span>{{ option.label }}</span>
              </button>
            }

            <div class="border-t border-slate-200 dark:border-slate-600 my-1"></div>

            <button
              (click)="onExportDataClick()"
              class="w-full px-4 py-3 text-left text-sm text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center gap-3"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 text-slate-500 dark:text-slate-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
                />
              </svg>
              <span>Daten exportieren</span>
            </button>

            <button
              (click)="onImportDataClick()"
              class="w-full px-4 py-3 text-left text-sm text-slate-900 dark:text-white hover:bg-slate-50 dark:hover:bg-slate-700 transition flex items-center gap-3 border-t border-slate-100 dark:border-slate-700"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 text-slate-500 dark:text-slate-400"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"
                />
              </svg>
              <span>Daten importieren</span>
            </button>
          </div>
          }
        </div>
      </div>
    </div>
  </div>

  <!-- Hidden file input for data import -->
  <input
    #fileInput
    type="file"
    accept=".json"
    (change)="onFileSelected($event)"
    class="hidden"
  />

  <!-- Hidden file input for CSV import -->
  <input
    #csvFileInput
    type="file"
    accept=".csv"
    (change)="onCsvFileSelected($event)"
    class="hidden"
  />

  <!-- Hidden file input for transaction CSV import -->
  <input
    #transactionCsvFileInput
    type="file"
    accept=".csv"
    (change)="onTransactionCsvFileSelected($event)"
    class="hidden"
  />

  <!-- Hidden file input for dividend CSV import -->
  <input
    #dividendCsvFileInput
    type="file"
    accept=".csv"
    (change)="onDividendCsvFileSelected($event)"
    class="hidden"
  />
</nav>
