@if (show()) {
<div
  class="fixed inset-0 bg-slate-900/50 dark:bg-black/70 z-50 flex items-center justify-center backdrop-blur-xs transition-opacity"
  (click)="onClose()"
  (keydown.escape)="onClose()"
  (keydown.enter)="onClose()"
  role="button"
  tabindex="0"
  aria-label="Close modal"
>
  <div
    class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl max-w-lg w-full p-6 m-4 border dark:border-slate-700 transition-colors"
    (click)="$event.stopPropagation()"
    (keydown.enter)="$event.stopPropagation()"
    (keydown.escape)="$event.stopPropagation()"
    role="dialog"
    aria-modal="true"
    tabindex="0"
  >
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-slate-900 dark:text-white">
        {{ isEditMode() ? 'Wertpapier bearbeiten' : 'Neues Wertpapier anlegen' }}
      </h2>
      <button
        (click)="onClose()"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <form [formRoot]="securityForm">
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label for="securityName" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Wertpapiername</label
          >
          <input
            id="securityName"
            type="text"
            [formField]="securityForm.name"
            class="modal-input"
            placeholder="z.B. Apple Inc."
          />
          <app-field-errors [state]="securityForm.name()" />
        </div>

        <div>
          <label for="securityType" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Typ</label
          >
          <select id="securityType" [formField]="securityForm.type" class="modal-input">
            <option value="STOCK">Aktie</option>
            <option value="ETF">ETF</option>
            <option value="BOND">Anleihe</option>
          </select>
        </div>

        <div>
          <label for="symbol" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Ticker Symbol</label
          >
          <input
            id="symbol"
            type="text"
            [formField]="securityForm.symbol"
            class="modal-input"
            placeholder="z.B. AAPL"
          />
          <app-field-errors [state]="securityForm.symbol()" />
        </div>

        <div>
          <label for="isin" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >ISIN</label
          >
          <input
            id="isin"
            type="text"
            [formField]="securityForm.isin"
            class="modal-input"
            placeholder="z.B. US0378331005"
          />
        </div>

        <div>
          <label for="wkn" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >WKN</label
          >
          <input
            id="wkn"
            type="text"
            [formField]="securityForm.wkn"
            class="modal-input"
            placeholder="z.B. 865985"
          />
        </div>

        <div>
          <label for="exchange" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Handelsplatz</label
          >
          <input
            id="exchange"
            type="text"
            [formField]="securityForm.exchange"
            class="modal-input"
            placeholder="z.B. NASDAQ, XETRA"
          />
          <app-field-errors [state]="securityForm.exchange()" />
        </div>

        <div>
          <label for="securityCurrency" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Handelswährung</label
          >
          <select id="securityCurrency" [formField]="securityForm.currency" class="modal-input">
            @for (currency of currencies(); track currency.code) {
              <option [value]="currency.code">{{ currency.code }} - {{ currency.name }}</option>
            }
          </select>
          <app-field-errors [state]="securityForm.currency()" />
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 text-slate-600 dark:text-slate-300 font-medium hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition"
        >
          Abbrechen
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-brand-600 text-white font-medium rounded-lg hover:bg-brand-700 transition shadow-xs"
        >
          {{ isEditMode() ? 'Aktualisieren' : 'Speichern' }}
        </button>
      </div>
    </form>
  </div>
</div>
}
