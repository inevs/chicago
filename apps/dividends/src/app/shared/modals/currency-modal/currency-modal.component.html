@if (show()) {
<div
  class="fixed inset-0 bg-slate-900/50 dark:bg-black/70 z-50 flex items-center justify-center backdrop-blur-xs transition-opacity"
  (click)="onClose()"
  (keydown.escape)="onClose()"
  tabindex="-1"
>
  <div
    class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl max-w-md w-full p-6 m-4 border dark:border-slate-700 transition-colors"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    tabindex="0"
  >
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-slate-900 dark:text-white">
        Neue Währung hinzufügen
      </h2>
      <button
        (click)="onClose()"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <form (submit)="onSubmit(); $event.preventDefault()">
      @if (validationError()) {
      <div class="mb-4 p-3 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg">
        <p class="text-sm text-red-600 dark:text-red-400">{{ validationError() }}</p>
      </div>
      }

      <div class="space-y-4">
        <div>
          <label for="currencyCode" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >ISO-Code (3 Buchstaben)</label
          >
          <input
            type="text"
            id="currencyCode"
            [value]="formData().code"
            (input)="onCodeInput($event)"
            name="currencyCode"
            placeholder="z.B. CHF, SEK, JPY"
            maxlength="3"
            required
            class="modal-input uppercase"
          />
          <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">
            3-stelliger ISO 4217 Code (wird automatisch in Großbuchstaben konvertiert)
          </p>
        </div>

        <div>
          <label for="currencyName" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Name</label
          >
          <input
            type="text"
            id="currencyName"
            [(ngModel)]="formData().name"
            (ngModelChange)="updateFormData('name', $event)"
            name="currencyName"
            placeholder="z.B. Schweizer Franken"
            required
            class="modal-input"
          />
        </div>
      </div>

      <div class="flex justify-end space-x-3 mt-6">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-colors"
        >
          Abbrechen
        </button>
        <button
          type="submit"
          class="px-4 py-2 text-sm font-medium text-white bg-brand-600 hover:bg-brand-700 rounded-lg transition-colors"
        >
          Hinzufügen
        </button>
      </div>
    </form>
  </div>
</div>
}
