@if (show()) {
<div
  class="fixed inset-0 bg-slate-900/50 dark:bg-black/70 z-50 flex items-center justify-center backdrop-blur-sm transition-opacity"
  (click)="onClose()"
  (keydown.escape)="onClose()"
  tabindex="-1"
>
  <div
    class="bg-white dark:bg-slate-800 rounded-xl shadow-2xl max-w-lg w-full p-6 m-4 border dark:border-slate-700 transition-colors"
    (click)="$event.stopPropagation()"
    (keydown)="$event.stopPropagation()"
    tabindex="0"
  >
    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold text-slate-900 dark:text-white">
        {{ editTransaction() ? 'Dividende bearbeiten' : 'Neue Dividende erfassen' }}
      </h2>
      <button
        (click)="onClose()"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M6 18L18 6M6 6l12 12"
          ></path>
        </svg>
      </button>
    </div>

    <form (submit)="onSubmit(); $event.preventDefault()">
      <div class="grid grid-cols-2 gap-4">
        <div class="col-span-2">
          <label for="securityAutocomplete" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Wertpapier</label
          >
          <app-security-autocomplete
            id="securityAutocomplete"
            [value]="formData().name"
            placeholder="z.B. Apple Inc. oder AAPL"
            (securitySelected)="onSecuritySelected($event)"
          />
        </div>

        <div>
          <label for="exDate" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Ex-Datum</label
          >
          <input
            id="exDate"
            type="date"
            [ngModel]="formData().exDate"
            (ngModelChange)="onExDateChange($event)"
            name="exDate"
            required
            class="modal-input"
          />
        </div>

        <div>
          <label for="payoutDate" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Auszahlungsdatum</label
          >
          <input
            id="payoutDate"
            type="date"
            [(ngModel)]="formData().payoutDate"
            name="payoutDate"
            required
            class="modal-input"
          />
        </div>

        <div>
          <label for="currency" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Währung</label
          >
          <select id="currency" [ngModel]="formData().currency" (ngModelChange)="onCurrencyChange($event)" name="currency" class="modal-input">
            @for (currency of currencies(); track currency.code) {
              <option [value]="currency.code">{{ currency.code }} - {{ currency.name }}</option>
            }
          </select>
        </div>

        <div>
          <label for="amount" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Anzahl Aktien</label
          >
          <input
            id="amount"
            type="number"
            step="0.0001"
            [ngModel]="formData().amount"
            (ngModelChange)="updateFormDataWithCalculation('amount', $event)"
            name="amount"
            required
            class="modal-input"
          />
        </div>

        <div>
          <label for="dividend" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Dividende/Aktie (Orig.)</label
          >
          <input
            id="dividend"
            type="number"
            step="0.0001"
            [ngModel]="formData().dividend"
            (ngModelChange)="updateFormDataWithCalculation('dividend', $event)"
            name="dividend"
            required
            class="modal-input"
          />
        </div>

        @if (formData().currency !== defaultCurrencyCode()) {
          <div>
            <label for="rate" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
              >Wechselkurs (zu {{ defaultCurrencyCode() }})</label
            >
            <input
              id="rate"
              type="number"
              step="0.0001"
              [ngModel]="formData().rate"
              (ngModelChange)="updateFormDataWithCalculation('rate', $event)"
              name="rate"
              class="modal-input"
              placeholder="1.0 bei {{ defaultCurrencyCode() }}"
            />
          </div>
        }

        <div>
          <label for="taxes" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Steuern (Orig. Währung)</label
          >
          <input
            id="taxes"
            type="number"
            step="0.01"
            [ngModel]="formData().taxes"
            (ngModelChange)="updateFormDataWithCalculation('taxes', $event)"
            name="taxes"
            class="modal-input"
          />
        </div>

        <div>
          <label for="finalPayment" class="block text-xs font-medium text-slate-500 dark:text-slate-400 mb-1"
            >Netto Auszahlung (EUR)</label
          >
          <input
            id="finalPayment"
            type="number"
            step="0.01"
            [ngModel]="formData().finalPayment"
            (ngModelChange)="updateFormData('finalPayment', $event)"
            name="finalPayment"
            required
            class="modal-input"
          />
        </div>
      </div>

      <div class="mt-6 flex justify-end gap-3">
        <button
          type="button"
          (click)="onClose()"
          class="px-4 py-2 text-slate-600 dark:text-slate-300 font-medium hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition"
        >
          Abbrechen
        </button>
        <button
          type="submit"
          class="px-4 py-2 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition shadow-sm"
        >
          {{ editTransaction() ? 'Aktualisieren' : 'Speichern' }}
        </button>
      </div>
    </form>
  </div>
</div>
}
