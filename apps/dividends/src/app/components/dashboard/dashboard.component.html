<app-header-nav
  [currentRange]="currentRange()"
  [isDarkMode]="isDarkMode()"
  [showMenu]="showMenu()"
  (rangeChange)="setRange($event)"
  (themeToggle)="toggleTheme()"
  (menuToggle)="toggleMenu()"
  (newTransactionClick)="toggleModal()"
  (newSecurityClick)="toggleSecurityModal()"
></app-header-nav>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
  <app-kpi-cards [kpis]="kpis()"></app-kpi-cards>

  <app-charts-section
    [transactions]="filteredTransactions()"
    [isDarkMode]="isDarkMode()"
    [currentRange]="currentRange()"
  ></app-charts-section>

  <app-transaction-table
    [transactions]="sortedTransactions()"
    (searchChange)="onSearchChange($event)"
  ></app-transaction-table>
</main>

<app-transaction-modal
  [show]="showModal()"
  (closeModal)="toggleModal()"
  (transactionSubmit)="handleTransactionSubmit($event)"
></app-transaction-modal>

<app-security-modal
  [show]="showSecurityModal()"
  (closeModal)="toggleSecurityModal()"
  (securitySubmit)="handleSecuritySubmit($event)"
></app-security-modal>
