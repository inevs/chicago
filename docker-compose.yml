services:
  postgres:
    image: postgres:16-alpine
    container_name: dividends-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: dividends
      POSTGRES_PASSWORD: dividends
      POSTGRES_DB: dividends
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dividends']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
